<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";


/* =========================================================
   DOM
========================================================= */

const viewer = document.getElementById("viewer");
const questionContainer = document.getElementById("questionContainer");


/* =========================================================
   QUESTIONNAIRE STATE
========================================================= */

const answers = {
    locations: [],
    depth: null,
    when: [],
    painType: [],
    selfTouch: null
};

let currentQuestion = 1;


/* =========================================================
   QUESTION DATA
========================================================= */

const questions = [

    {
        title: "Where do you feel pain?",
        description: "Select every area where you experience pain."
    },

    {
        title: "Is the pain superficial or deep in the pelvis?",
        description: "Select the location that best describes the depth of your pain."
    },

    {
        title: "When does it hurt?",
        description: "Select every situation in which you experience pain."
    },

    {
        title: "What type of pain do you feel?",
        description: "Select every description that applies."
    },

    {
        title: "Do you feel the same amount of pain during self touch?",
        description: "Select the answer that best describes your experience."

];


/* =========================================================
   QUESTION OPTIONS
========================================================= */

function getOptionsForQuestion(questionNumber) {

    if (questionNumber === 1) {

        return [
            {
                label: "Clitoris",
                value: "clitoris"

            {
                label: "Entrance of vagina / vestibule",

            },

            },
            {
                label: "Perineum",
                value: "perineum"
            },
            {
                label: "Deep pelvis",
                value: "deep-pelvis"
            }
        ];

    }


    if (questionNumber === 2) {

        return [
            {
                label: "Superficial",
                value: "superficial"
            },
            {
                label: "Deep in pelvis",
                value: "deep"
            }
        ];

    if (questionNumber === 3) {

            {

    if (questionNumber === 5) {

        return [

                label: "Yes, always",
                value: "always"
            },
            {
                label: "Yes, but sometimes",
                value: "sometimes"
            },
            {
                label: "Yes, but lesser / weaker",
                value: "weaker"
            },
            {
                label: "No",
                value: "no"
            }

    }

}


/* =========================================================

========================================================= */

/*
    These are the questionnaire categories.

    IMPORTANT:
    left_labia and right_labia are separate anatomical
    hotspots, but both belong to the questionnaire category

*/

const locationMap = {

    clitoris: "clitoris",

    right_labia: "outer-vulva",

    vestibule: "vaginal-entrance",

    urethra: "urethra",

    perineum: "perineum",

    deep_pelvis: "deep-pelvis"

};


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion() {

    const question = questions[currentQuestion - 1];

    const options = getOptionsForQuestion(currentQuestion);

    questionContainer.innerHTML = "";


    const progress = document.createElement("div");

    progress.className = "progress";

    progress.textContent =
        `Question ${currentQuestion} of ${questions.length}`;

    questionContainer.appendChild(progress);


    const title = document.createElement("h1");

    title.textContent = question.title;

    questionContainer.appendChild(title);


    const description = document.createElement("p");

    description.className = "question-description";

    description.textContent = question.description;

    questionContainer.appendChild(description);


    options.forEach(option => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = option.label;

        button.dataset.value = option.value;

        /*
            Restore selected state.
        */

        if (currentQuestion === 1) {

            if (answers.locations.includes(option.value)) {
                button.classList.add("selected");
            }

        }

        if (currentQuestion === 2) {

            if (answers.depth === option.value) {
                button.classList.add("selected");
            }

        }

        if (currentQuestion === 3) {

            if (answers.when.includes(option.value)) {
                button.classList.add("selected");
            }

        }

        if (currentQuestion === 4) {

            if (answers.painType.includes(option.value)) {
                button.classList.add("selected");
            }

        }

        if (currentQuestion === 5) {

            if (answers.selfTouch === option.value) {
                button.classList.add("selected");
            }

        }

        questionContainer.appendChild(button);

    });


    const nextButton = document.createElement("button");

    nextButton.id = "nextButton";

    nextButton.textContent =
        currentQuestion === questions.length
            ? "See results"
            : "Continue";


    /*
        Enable/disable Continue based on current state.
    */

    if (currentQuestion === 1) {
        nextButton.disabled = answers.locations.length === 0;
    }

    if (currentQuestion === 2) {
        nextButton.disabled = !answers.depth;
    }

    if (currentQuestion === 3) {
        nextButton.disabled = answers.when.length === 0;
    }

    if (currentQuestion === 4) {
        nextButton.disabled = answers.painType.length === 0;
    }

    if (currentQuestion === 5) {
        nextButton.disabled = !answers.selfTouch;
    }


    questionContainer.appendChild(nextButton);


    /*
        Keep the 3D model synchronized with Q1.
    */

    updateZoneHighlights();
}


/* =========================================================
   ANSWER HANDLING
========================================================= */

function handleAnswer(button, value) {

    /*
        Q1 = multiple selection
    */

    if (currentQuestion === 1) {

        button.classList.toggle("selected");

        const selectedButtons =
            questionContainer.querySelectorAll(".answer.selected");

        answers.locations =
            Array.from(selectedButtons)
                .map(button => button.dataset.value);

        const nextButton =
            document.getElementById("nextButton");

        if (nextButton) {
            nextButton.disabled =
                answers.locations.length === 0;
        }

        updateZoneHighlights();

        return;
    }


    /*
        Q3 = multiple selection
    */

    if (currentQuestion === 3) {

        button.classList.toggle("selected");

        const selectedButtons =
            questionContainer.querySelectorAll(".answer.selected");

        answers.when =
            Array.from(selectedButtons)
                .map(button => button.dataset.value);

        const nextButton =
            document.getElementById("nextButton");

        if (nextButton) {
            nextButton.disabled =
                answers.when.length === 0;
        }

        return;
    }


    /*
        Q4 = multiple selection
    */

    if (currentQuestion === 4) {

        button.classList.toggle("selected");

        const selectedButtons =
            questionContainer.querySelectorAll(".answer.selected");

        answers.painType =
            Array.from(selectedButtons)
                .map(button => button.dataset.value);

        const nextButton =
            document.getElementById("nextButton");

        if (nextButton) {
            nextButton.disabled =
                answers.painType.length === 0;
        }

        return;
    }


    /*
        Q2 = single selection
    */

    if (currentQuestion === 2) {

        const allButtons =
            questionContainer.querySelectorAll(".answer");

        allButtons.forEach(button => {
            button.classList.remove("selected");
        });

        button.classList.add("selected");

        answers.depth = value;

        const nextButton =
            document.getElementById("nextButton");

        if (nextButton) {
            nextButton.disabled = false;
        }

        return;
    }


    /*
        Q5 = single selection
    */

    if (currentQuestion === 5) {

        const allButtons =
            questionContainer.querySelectorAll(".answer");

        allButtons.forEach(button => {
            button.classList.remove("selected");
        });

        button.classList.add("selected");

        answers.selfTouch = value;

        const nextButton =
            document.getElementById("nextButton");

        if (nextButton) {
            nextButton.disabled = false;
        }

        return;
    }

}


/* =========================================================
   ANSWER BUTTON EVENT DELEGATION
========================================================= */

questionContainer.addEventListener("click", event => {

    const answerButton =
        event.target.closest(".answer");

    if (answerButton) {

        handleAnswer(
            answerButton,
            answerButton.dataset.value
        );

        return;
    }


    if (event.target.id !== "nextButton") {
        return;
    }


    /*
        Save current question before advancing.
    */

    const selectedButtons =
        questionContainer.querySelectorAll(".answer.selected");

    const selectedValues =
        Array.from(selectedButtons)
            .map(button => button.dataset.value);


    if (currentQuestion === 1) {
        answers.locations = selectedValues;
    }

    if (currentQuestion === 2) {
        answers.depth = selectedValues[0];
    }

    if (currentQuestion === 3) {
        answers.when = selectedValues;
    }

    if (currentQuestion === 4) {
        answers.painType = selectedValues;
    }

    if (currentQuestion === 5) {

        answers.selfTouch = selectedValues[0];

        console.log(
            "Completed questionnaire:",
            answers
        );

        showResults();

        return;
    }


    currentQuestion++;

    renderQuestion();

});

/* =========================================================

function createEllipsoid(
    material,
    position,
    scale
) {

    const geometry =
        new THREE.SphereGeometry(
            1,
            48,
            32
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        position[0],
        position[1],
        position[2]
    );

    mesh.scale.set(
        scale[0],
        scale[1],
        scale[2]
    );

    vulva.add(mesh);

    return mesh;
}

/* =========================================================

function createHighlight(
    id,
    position,
    scale
) {

    const geometry =
        new THREE.SphereGeometry(
            1,
            32,
            20
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            highlightMaterial
        );

    mesh.position.set(
        position[0],
        position[1],
        position[2]
    );

    mesh.scale.set(
        scale[0],
        scale[1],
        scale[2]
    );

    */

    mesh.position.z += 0.08;

    vulva.add(mesh);

    highlightMeshes[id] = mesh;

    return mesh;
}

/* =========================================================
   RAYCASTING
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


function updatePointer(event) {

    const rect =
        renderer.domElement.getBoundingClientRect();

    mouse.x =
        (
            (event.clientX - rect.left)
            / rect.width
        ) * 2 - 1;

    mouse.y =
        -(
            (event.clientY - rect.top)
            / rect.height
        ) * 2 + 1;


    raycaster.setFromCamera(
        mouse,
        camera
    );

}


/* =========================================================
   GET BEST HOTSPOT
========================================================= */

function getBestHotspot() {

    const intersections =
        raycaster.intersectObjects(
            hotspotMeshes,
            false
        );


    if (
        intersections.length === 0
    ) {
        return null;
    }


    /*
        If multiple hotspots overlap,
        higher priority wins.
    */

    intersections.sort(
        (a, b) => {

            const priorityA =
                a.object.userData.priority ?? 0;

            const priorityB =
                b.object.userData.priority ?? 0;

            return priorityB - priorityA;

        }
    );


    return intersections[0];
}


/* =========================================================
   HOVER
========================================================= */

let hoveredZone = null;


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        updatePointer(event);

        const intersection =
            getBestHotspot();


        if (intersection) {

            hoveredZone =
                intersection.object.userData.zone;

            renderer.domElement.style.cursor =
                "pointer";

        } else {

            hoveredZone = null;

            renderer.domElement.style.cursor =
                "default";

        }

    }
);


/* =========================================================
   CLICK MODEL
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        updatePointer(event);

        const intersection =
            getBestHotspot();


        if (!intersection) {
            return;
        }


        const zone =
            intersection.object.userData.zone;


        showZone(zone);

    }
);


/* =========================================================
   SHOW / SELECT ZONE
========================================================= */

function showZone(zone) {

    /*
        Deep pelvis intentionally has no clickable surface
        hotspot right now.
    */

    const selectedLocation =
        locationMap[zone.id];


    if (!selectedLocation) {

        console.log(
            "Unknown zone:",
            zone.id
        );

        return;
    }


    /*
        Toggle questionnaire location.
    */

    const index =
        answers.locations.indexOf(
            selectedLocation
        );


    if (index === -1) {

        answers.locations.push(
            selectedLocation
        );

    } else {

        answers.locations.splice(
            index,
            1
        );

    }


    /*
        Model interaction is specifically for
        choosing anatomical location.

        Therefore return the questionnaire to Q1.
    */

    currentQuestion = 1;

    renderQuestion();

    updateZoneHighlights();


    console.log(
        "Selected anatomical areas:",
        answers.locations
    );

}


/* =========================================================
   RESULTS
========================================================= */

function calculateResults() {

    const results = [];


    /*
        Vestibular pattern
    */

    if (
        answers.locations.includes(
            "vaginal-entrance"
        )
        &&
        (
            answers.when.includes(
                "during-intercourse"
            )
            ||
            answers.when.includes(
                "anticipation"
            )
        )
    ) {

        results.push({

            title:
                "Vestibular pain pattern",

            description:
                "Pain at or around the vaginal entrance, particularly when pressure or penetration is involved, can be seen in patterns of provoked vestibular pain."
        });

    }


    /*
        Clitoral / localized vulvar pattern
    */

    if (
        answers.locations.includes(
            "clitoris"
        )
        &&
        (
            answers.painType.includes(
                "burning"
            )
            ||
            answers.painType.includes(
                "sharp"
            )
        )
    ) {

        results.push({

            title:
                "Localized clitoral / vulvar pain pattern",

            description:
                "Localized burning or sharp pain around the clitoral or vulvar area can have several possible explanations, including irritation, inflammation, or nerve-related pain."
        });

    }


    /*
        Urethral-area pattern
    */

    if (
        answers.locations.includes(
            "urethra"
        )
    ) {

        results.push({

            title:
                "Urethral-area pain pattern",

            description:
                "Pain perceived around the urethral area can have urinary, urethral, vulvar, or pelvic causes and may warrant further assessment depending on accompanying symptoms."
        });

    }


    /*
        Deep pelvic pattern
    */

    if (
        answers.depth === "deep"
        ||
        answers.locations.includes(
            "deep-pelvis"
        )
        ||
        (
            answers.locations.includes(
                "vaginal-entrance"
            )
            &&
            (
                answers.painType.includes(
                    "aching"
                )
                ||
                answers.painType.includes(
                    "contraction"
                )
                ||
                answers.painType.includes(
                    "pulsating"
                )
            )
        )
    ) {

        results.push({

            title:
                "Deep pelvic pain pattern",

            description:
                "Pain described as deep in the pelvis can involve pelvic-floor muscles or other pelvic structures and may require a broader pelvic assessment."
        });

    }


    /*
        Pelvic-floor involvement
    */

    if (
        answers.painType.includes(
            "contraction"
        )
        &&
        (
            answers.when.includes(
                "during-intercourse"
            )
            ||
            answers.when.includes(
                "anticipation"
            )
            ||
            answers.when.includes(
                "orgasm"
            )
        )
    ) {

        results.push({

            title:
                "Possible pelvic-floor muscle involvement",

            description:
                "Pain associated with a sensation of contraction during intercourse, anticipation of penetration, or orgasm can occur alongside pelvic-floor muscle involvement."
        });

    }


    /*
        Default result
    */

    if (results.length === 0) {

        results.push({

            title:
                "Several possible patterns",

            description:
                "The combination of symptoms does not point to one clear pattern in this preliminary questionnaire. A healthcare professional can assess the location, triggers, and characteristics of the pain in more detail."
        });

    }


    return results;

}


/* =========================================================

========================================================= */

function showResults() {

    const results =

    questionContainer.innerHTML = "";


    const wrapper =

        );

        "disclaimer";

    disclaimer.textContent =
        "This tool is for educational purposes only. It does not diagnose a medical condition or replace an assessment by a qualified healthcare professional.";


    wrapper.appendChild(

    );


    const resetButton =

    resetButton.id =

    resetButton.textContent =

    wrapper.appendChild(

    );


    questionContainer.appendChild(

    );

}

);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            viewer.clientWidth
            /
            viewer.clientHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================

========================================================= */

renderQuestion();
